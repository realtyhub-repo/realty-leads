spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: leads

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}


  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}

  jpa:
      hibernate:
        ddl-auto: validate

      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 8084

servicios:
  usuarios-url: ${USUARIOS_URL:http://localhost:8082}
  propiedades-url: ${PROPIEDADES_URL:http://localhost:8083}
  visitas-url: ${VISITAS_URL:http://localhost:8085}
