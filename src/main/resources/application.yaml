spring:
  application:
    name: leads

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}

  jpa:
      hibernate:
        ddl-auto: validate

      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 8084